name: Update payload catalog

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild payloads.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_payloads.py

      - name: Commit and push if changed
        run: |
          git config user.name "payload-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add payloads.json mirror
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update payload catalog"
            git push
          fi
